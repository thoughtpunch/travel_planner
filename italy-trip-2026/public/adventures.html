<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventures & activities — the whole trip · Italy 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kids.css">
<style>
  :root{
    --ink:#1A1510; --cream:#F5F0E8; --warm:#FDFAF4; --terra:#C4531A; --ochre:#D4920A;
    --stone:#8C7B6B; --rule:#C4B9A8; --line:#E4DACB;
  }
  body{background:var(--cream);color:var(--ink);margin:0}
  .adv-head{padding:40px 32px 18px;max-width:1500px;margin:0 auto}
  .adv-back{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--terra);text-decoration:none}
  .adv-back:hover{color:var(--ochre)}
  .adv-h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:14px 0 8px}
  .adv-h1 em{font-style:italic;color:var(--terra);font-weight:400}
  .adv-sub{font-family:'DM Sans',sans-serif;font-size:15px;color:var(--ink);opacity:.78;max-width:720px}
  .adv-sub a{color:var(--terra)}

  /* controls */
  .adv-controls{position:sticky;top:0;z-index:50;background:var(--warm);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 32px}
  .adv-controls-inner{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .adv-searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .adv-search{flex:1;min-width:220px;font-family:'DM Sans',sans-serif;font-size:15px;padding:10px 13px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
  .adv-search:focus{outline:none;border-color:var(--terra)}
  .adv-star-toggle,.adv-reset{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .adv-star-toggle.on{background:var(--ink);color:var(--ochre);border-color:var(--ink)}
  .adv-reset:hover,.adv-star-toggle:hover{border-color:var(--terra)}
  .adv-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--stone);white-space:nowrap}
  .adv-filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .adv-fgroup{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:4px 8px 4px 6px;border:1px solid var(--line);border-radius:20px;background:#fff}
  .adv-fglabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin-right:2px}
  .adv-chip{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3px;padding:4px 9px;border-radius:20px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
  .adv-chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .adv-chip.on[data-kind="kid"]{background:var(--kidcol,var(--terra));border-color:var(--kidcol,var(--terra))}

  /* table */
  .adv-tablewrap{max-width:1500px;margin:0 auto;padding:0 16px 60px;overflow-x:auto}
  table.adv{border-collapse:collapse;width:100%;min-width:1120px;font-family:'DM Sans',sans-serif;font-size:13.5px;background:var(--warm)}
  table.adv thead th{position:sticky;top:0;background:var(--ink);color:var(--cream);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:500;text-align:left;padding:11px 12px;cursor:pointer;white-space:nowrap;z-index:5}
  table.adv thead th:hover{color:var(--ochre)}
  table.adv thead th .ar{opacity:.5;font-size:9px}
  table.adv tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.adv tbody tr:hover{background:#fff}
  .c-leg{font-family:'DM Mono',monospace;font-weight:500;color:var(--terra);white-space:nowrap}
  .c-leg small{display:block;color:var(--stone);font-size:10px;letter-spacing:.3px;margin-top:2px}
  .c-city{font-weight:500;white-space:nowrap}
  .c-region{color:var(--stone);font-size:12px;white-space:nowrap}
  .c-title{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;line-height:1.2;min-width:210px}
  .adv-thumb-img{width:100%;max-width:230px;height:92px;object-fit:cover;border-radius:4px;display:block;margin-bottom:8px;background:#e9e2d6}
  .c-title .em{font-size:14px;margin-right:4px}
  .c-title .star{color:var(--ochre);font-size:12px}
  .c-desc{color:var(--ink);opacity:.85;line-height:1.4;min-width:230px;max-width:340px}
  .c-get{color:var(--ink);opacity:.8;line-height:1.35;min-width:170px;max-width:230px;font-size:12.5px}
  .c-cost{white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;color:var(--ink)}
  .c-for{white-space:nowrap}
  .kid{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.3px;color:#fff;border-radius:20px;padding:2px 7px;margin:0 3px 3px 0;text-transform:uppercase}
  .c-links a{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--terra);text-decoration:none;border:1px solid var(--rule);border-radius:4px;padding:3px 7px;margin:0 4px 4px 0;white-space:nowrap}
  .c-links a:hover{border-color:var(--terra);background:var(--terra);color:#fff}
  .reach-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--stone);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-top:5px}
  .adv-empty{padding:50px;text-align:center;color:var(--stone);font-family:'DM Mono',monospace;font-size:13px}
  .adv-sync{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3px;color:var(--stone);white-space:nowrap}
  .adv-sync.ok{color:#2C7A7B}.adv-sync.warn{color:#B7791F}
  .c-plan{white-space:nowrap;min-width:150px}
  .adv-status{font-family:'DM Mono',monospace;font-size:11px;padding:4px 6px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
  .adv-note{display:block;margin-top:5px;width:140px;font-family:'DM Sans',sans-serif;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
  .adv-note:focus,.adv-status:focus{outline:none;border-color:var(--terra)}
  table.adv tbody tr[data-status="booked"]{background:rgba(44,122,123,.08)}
  table.adv tbody tr[data-status="want"]{background:rgba(212,146,10,.08)}
  table.adv tbody tr[data-status="skip"]{opacity:.5}
  .adv-chip.on[data-kind="plan"]{background:#2C7A7B;border-color:#2C7A7B}
  @media(max-width:640px){
    .adv-head{padding:28px 18px 12px}.adv-controls{padding:12px 16px}
    .c-region,.c-get{display:none}
  }
</style>
</head>
<body>

<header class="adv-head">
  <a class="adv-back" href="/">← Map</a>
  <h1 class="adv-h1">Adventures <em>&amp; activities</em></h1>
  <p class="adv-sub">Everything worth doing across the trip, in one filterable table — filter by leg, kid, type or how reachable it is, or just search. ★ = extra-high adventure. Full raw list: <a href="/adventures.csv" download>adventures.csv</a>.</p>
</header>

<div class="adv-controls">
  <div class="adv-controls-inner">
    <div class="adv-searchrow">
      <input id="advSearch" class="adv-search" type="search" placeholder="Search title, place, description…" autocomplete="off">
      <button id="advStar" class="adv-star-toggle" type="button">★ Must-do only</button>
      <button id="advReset" class="adv-reset" type="button">Reset</button>
      <span id="advCount" class="adv-count"></span>
      <span id="advSync" class="adv-sync"></span>
    </div>
    <div id="advFilters" class="adv-filters"></div>
  </div>
</div>

<div class="adv-tablewrap">
  <table class="adv">
    <thead><tr id="advHead"></tr></thead>
    <tbody id="advBody"></tbody>
  </table>
  <div id="advEmpty" class="adv-empty" style="display:none">No matches — try clearing a filter.</div>
</div>

<script src="/adventures-data.js" defer></script>
<script src="/menu.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  var DATA = window.TRIP_ADVENTURES || [];
  var LEGS = window.TRIP_LEGS || [];
  var legMap = {}; LEGS.forEach(function (l) { legMap[l.leg] = l; });

  var KIDS = [
    { id:'rhys', label:'Rhys', col:'#C4531A' },
    { id:'jude', label:'Jude', col:'#8C6239' },
    { id:'grey', label:'Grey', col:'#2C7A7B' },
    { id:'keir', label:'Keir', col:'#3D7EA6' },
    { id:'parents', label:'Dan & Kei', col:'#6B5B95' },
    { id:'all',  label:'All',  col:'#8C7B6B' },
  ];
  var kidCol = {}; KIDS.forEach(function (k) { kidCol[k.id] = k; });

  var CATS = {
    machines:['⚙️','Machines'], rock:['🪨','Rocks & gems'], weird:['💀','Weird museum'],
    hunt:['🗺️','Treasure hunt'], craft:['🛠️','Craft & workshop'], transport:['🚡','Transport'],
    castle:['🏰','Castle & fort'], water:['🚣','Water & boats'], detour:['🚂','On-the-way stop'],
    whoa:['😮','Big “whoa”'], underground:['🕳️','Underground'], secret:['🔑','Behind-the-scenes'],
    maze:['🌀','Maze & illusion'], thrill:['🧗','Climb & thrill'], food:['🍕','Food you make'],
    architecture:['🏛️','Weird architecture'], animals:['🦅','Animals'], caves:['🦇','Caves'],
    mountain:['⛰️','Mountains'], art:['🖼️','Art & masters'], sight:['📸','Landmark & view'],
    dining:['🍽️','Dining out'], nature:['🌿','Nature & gardens'], church:['⛪','Church & relics'],
    market:['🛍️','Market & food hall'], bike:['🚵','Trail biking']
  };
  var REACH = { base:'In town', way:'On the way', day:'Day-trip', far:'Far · own trip' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mapsUrl(it){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.n + ' ' + it.city + ' Italy'); }

  // ── stable id per activity (must match the sheet seed) + lookup ──
  function slug(it){ return it.leg + '-' + String(it.n).toLowerCase().normalize('NFKD')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
  var ID2IT = {};
  DATA.forEach(function (it){ it._id = slug(it); ID2IT[it._id] = it; });

  // ── save-back (Google Sheet via /api) + local fallback ──
  var SAVE = { secret: 'italy2026-adv-sync-7Qx', save: '/api/save', list: '/api/list' };
  var PLAN_KEY = 'advPlanV1';
  var plan = {};
  try { plan = JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch (e) { plan = {}; }
  var syncEl = document.getElementById('advSync');
  function setSync(t, cls){ if (syncEl){ syncEl.textContent = t; syncEl.className = 'adv-sync' + (cls ? ' ' + cls : ''); } }
  var STLBL = { '':'—', want:'Want', booked:'Booked', skip:'Skip' };
  var saveTimers = {};
  function pushSave(id){
    var it = ID2IT[id]; if (!it) return;
    var p = plan[id] || { status:'', notes:'' };
    localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
    clearTimeout(saveTimers[id]);
    saveTimers[id] = setTimeout(function (){
      setSync('☁ Saving…', '');
      fetch(SAVE.save, { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ secret:SAVE.secret, id:id, title:it.n, leg:it.leg, city:it.city, status:p.status, notes:p.notes }) })
        .then(function (r){ return r.json(); })
        .then(function (j){ setSync(j && j.ok ? '☁ Synced to Sheet' : '⌂ Saved on device (sheet: ' + ((j && j.reason) || 'error') + ')', j && j.ok ? 'ok' : 'warn'); })
        .catch(function (){ setSync('⌂ Saved on device (offline)', 'warn'); });
    }, 450);
  }

  // ── filter state ──
  var state = { legs:{}, kids:{}, cats:{}, reach:{}, plan:{}, q:'', star:false, sort:{ col:'leg', dir:1 } };

  // seed from URL (?kid=jude&leg=5)
  var params = new URLSearchParams(location.search);
  if (params.get('kid') && kidCol[params.get('kid')]) state.kids[params.get('kid')] = true;
  if (params.get('leg')) state.legs[params.get('leg')] = true;

  // ── build filter chips ──
  var filtersEl = document.getElementById('advFilters');
  function bagOf(kind){ return kind === 'kid' ? state.kids : kind === 'leg' ? state.legs : kind === 'cat' ? state.cats : kind === 'plan' ? state.plan : state.reach; }
  function chip(kind, id, label, col) {
    var on = bagOf(kind)[id];
    var extra = (kind === 'kid') ? ' data-kind="kid" style="' + (on ? '--kidcol:' + col : '') + '"' : '';
    return '<button type="button" class="adv-chip' + (on ? ' on' : '') + '"' + extra +
      ' data-kind="' + kind + '" data-id="' + esc(id) + '">' + esc(label) + '</button>';
  }
  function buildFilters() {
    var usedCats = {}; DATA.forEach(function (d) { usedCats[d.c] = true; });
    var h = '';
    h += '<div class="adv-fgroup"><span class="adv-fglabel">Leg</span>' +
      LEGS.map(function (l) { return chip('leg', String(l.leg), l.leg + ' · ' + l.city); }).join('') + '</div>';
    h += '<div class="adv-fgroup"><span class="adv-fglabel">Kid</span>' +
      KIDS.map(function (k) { return chip('kid', k.id, k.label, k.col); }).join('') + '</div>';
    h += '<div class="adv-fgroup"><span class="adv-fglabel">Reach</span>' +
      Object.keys(REACH).map(function (r) { return chip('reach', r, REACH[r]); }).join('') + '</div>';
    h += '<div class="adv-fgroup"><span class="adv-fglabel">Plan</span>' +
      [['want','Want'],['booked','Booked'],['skip','Skip'],['none','Unplanned']]
        .map(function (p) { return chip('plan', p[0], p[1]); }).join('') + '</div>';
    h += '<div class="adv-fgroup"><span class="adv-fglabel">Type</span>' +
      Object.keys(CATS).filter(function (c) { return usedCats[c]; })
        .map(function (c) { return chip('cat', c, CATS[c][0] + ' ' + CATS[c][1]); }).join('') + '</div>';
    filtersEl.innerHTML = h;
  }

  // ── header ──
  var COLS = [
    { key:'plan', label:'Your plan', nosort:true },
    { key:'leg', label:'Leg' }, { key:'city', label:'City' }, { key:'rg', label:'Region' },
    { key:'n', label:'Title' }, { key:'b', label:'Description' }, { key:'w', label:'Ideal for', nosort:true },
    { key:'g', label:'How to get there' }, { key:'k', label:'Cost' }, { key:'links', label:'Links', nosort:true }
  ];
  function buildHead() {
    document.getElementById('advHead').innerHTML = COLS.map(function (c) {
      var ar = '';
      if (!c.nosort && state.sort.col === c.key) ar = ' <span class="ar">' + (state.sort.dir > 0 ? '▲' : '▼') + '</span>';
      return '<th data-col="' + c.key + '"' + (c.nosort ? ' data-nosort="1"' : '') + '>' + esc(c.label) + ar + '</th>';
    }).join('');
  }

  // ── filter + sort + render ──
  function anyOn(o){ return Object.keys(o).some(function (k) { return o[k]; }); }
  function passes(it) {
    if (anyOn(state.legs) && !state.legs[String(it.leg)]) return false;
    if (anyOn(state.kids)) {
      var hit = (it.w || []).some(function (w) { return state.kids[w]; }) || (it.w || []).indexOf('all') > -1;
      if (!hit) return false;
    }
    if (anyOn(state.cats) && !state.cats[it.c]) return false;
    if (anyOn(state.reach) && !state.reach[it.r]) return false;
    if (anyOn(state.plan)) { var st = (plan[it._id] && plan[it._id].status) || 'none'; if (st === '') st = 'none'; if (!state.plan[st]) return false; }
    if (state.star && !it.s) return false;
    if (state.q) {
      var hay = (it.n + ' ' + it.b + ' ' + it.city + ' ' + it.rg + ' ' + (it.g || '')).toLowerCase();
      var toks = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!toks.every(function (t) { return hay.indexOf(t) > -1; })) return false;
    }
    return true;
  }
  function sortRows(rows) {
    var col = state.sort.col, dir = state.sort.dir;
    return rows.slice().sort(function (a, b) {
      var va, vb;
      if (col === 'leg') { va = a.leg; vb = b.leg; if (va !== vb) return (va - vb) * dir; va = a.n; vb = b.n; }
      else { va = (a[col] || '').toString().toLowerCase(); vb = (b[col] || '').toString().toLowerCase(); }
      return va < vb ? -dir : va > vb ? dir : 0;
    });
  }
  function render() {
    var rows = sortRows(DATA.filter(passes));
    var body = document.getElementById('advBody');
    document.getElementById('advCount').textContent = rows.length + ' of ' + DATA.length;
    document.getElementById('advEmpty').style.display = rows.length ? 'none' : 'block';
    body.innerHTML = rows.map(function (it) {
      var lg = legMap[it.leg] || {};
      var cat = CATS[it.c] || ['✨',''];
      var kids = (it.w || []).map(function (w) {
        var k = kidCol[w] || { label:w, col:'#8C7B6B' };
        return '<span class="kid" style="background:' + k.col + '">' + esc(k.label) + '</span>';
      }).join('');
      var links = '';
      if (it.l) links += '<a href="' + esc(it.l) + '" target="_blank" rel="noopener">Site ↗</a>';
      links += '<a href="' + mapsUrl(it) + '" target="_blank" rel="noopener">Map ↗</a>';
      var p = plan[it._id] || { status:'', notes:'' };
      var sel = '<select class="adv-status" data-id="' + esc(it._id) + '">' +
        ['','want','booked','skip'].map(function (o){ return '<option value="' + o + '"' + (p.status === o ? ' selected' : '') + '>' + STLBL[o] + '</option>'; }).join('') + '</select>';
      var note = '<input class="adv-note" data-id="' + esc(it._id) + '" placeholder="notes…" value="' + esc(p.notes || '') + '">';
      return '<tr data-id="' + esc(it._id) + '" data-status="' + esc(p.status || '') + '">' +
        '<td class="c-plan">' + sel + note + '</td>' +
        '<td class="c-leg">' + it.leg + '<small>' + esc(lg.dates || '') + '</small></td>' +
        '<td class="c-city">' + esc(it.city) + '</td>' +
        '<td class="c-region">' + esc(it.rg) + '</td>' +
        '<td class="c-title">' + (it.img ? '<img class="adv-thumb-img" loading="lazy" decoding="async" alt="" src="' + esc(it.img) + '" onerror="this.style.display=\'none\'">' : '') + '<span class="em">' + cat[0] + '</span>' + esc(it.n) + (it.s ? ' <span class="star">★</span>' : '') + '</td>' +
        '<td class="c-desc">' + esc(it.b) + '</td>' +
        '<td class="c-for">' + kids + '</td>' +
        '<td class="c-get">' + esc(it.g || '') + '<span class="reach-badge">' + esc(REACH[it.r] || '') + '</span></td>' +
        '<td class="c-cost">' + esc(it.k || '—') + '</td>' +
        '<td class="c-links">' + links + '</td>' +
      '</tr>';
    }).join('');
  }

  // ── events ──
  filtersEl.addEventListener('click', function (e) {
    var b = e.target.closest('.adv-chip'); if (!b) return;
    var kind = b.getAttribute('data-kind'), id = b.getAttribute('data-id');
    var bag = bagOf(kind);
    bag[id] = !bag[id];
    buildFilters(); render();
  });
  document.getElementById('advSearch').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.getElementById('advStar').addEventListener('click', function () {
    state.star = !state.star; this.classList.toggle('on', state.star); render();
  });
  document.getElementById('advReset').addEventListener('click', function () {
    state = { legs:{}, kids:{}, cats:{}, reach:{}, plan:{}, q:'', star:false, sort:{ col:'leg', dir:1 } };
    document.getElementById('advSearch').value = '';
    document.getElementById('advStar').classList.remove('on');
    buildFilters(); buildHead(); render();
  });
  document.getElementById('advHead').addEventListener('click', function (e) {
    var th = e.target.closest('th'); if (!th || th.getAttribute('data-nosort')) return;
    var col = th.getAttribute('data-col');
    if (state.sort.col === col) state.sort.dir *= -1; else state.sort = { col:col, dir:1 };
    buildHead(); render();
  });

  // ── plan controls: status select + notes, saved to sheet (+ local) ──
  var bodyEl = document.getElementById('advBody');
  bodyEl.addEventListener('change', function (e) {
    var s = e.target.closest('.adv-status'); if (!s) return;
    var id = s.getAttribute('data-id');
    plan[id] = plan[id] || { status:'', notes:'' }; plan[id].status = s.value;
    var tr = s.closest('tr'); if (tr) tr.setAttribute('data-status', s.value);
    pushSave(id);
    if (anyOn(state.plan)) render();
  });
  bodyEl.addEventListener('input', function (e) {
    var n = e.target.closest('.adv-note'); if (!n) return;
    var id = n.getAttribute('data-id');
    plan[id] = plan[id] || { status:'', notes:'' }; plan[id].notes = n.value;
    pushSave(id);
  });

  buildFilters(); buildHead(); render();

  // ── hydrate saved plan from the Sheet (falls back to local) ──
  setSync('☁ …', '');
  fetch(SAVE.list, { headers:{ 'Accept':'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok) {
        (j.items || []).forEach(function (x) { plan[x.id] = { status:x.status || '', notes:x.notes || '' }; });
        localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
        setSync('☁ Synced to Sheet', 'ok');
        render();
      } else {
        setSync(j && j.reason === 'not_configured' ? '⌂ Saved on this device (Sheet not connected yet)' : '⌂ Saved on this device', 'warn');
      }
    })
    .catch(function () { setSync('⌂ Saved on this device', 'warn'); });
});
</script>
</body>
</html>
