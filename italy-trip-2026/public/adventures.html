<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventures & activities — the whole trip · Italy 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kids.css">
<style>
  :root{
    --ink:#1A1510; --cream:#F5F0E8; --warm:#FDFAF4; --terra:#C4531A; --ochre:#D4920A;
    --stone:#8C7B6B; --rule:#C4B9A8; --line:#E4DACB;
  }
  body{background:var(--cream);color:var(--ink);margin:0}
  .adv-head{padding:22px 32px 10px;max-width:1500px;margin:0 auto}
  .adv-back{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--terra);text-decoration:none}
  .adv-back:hover{color:var(--ochre)}
  .adv-h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:14px 0 8px}
  .adv-h1 em{font-style:italic;color:var(--terra);font-weight:400}
  .adv-sub{font-family:'DM Sans',sans-serif;font-size:15px;color:var(--ink);opacity:.78;max-width:720px}
  .adv-sub a{color:var(--terra)}

  /* controls */
  .adv-controls{position:sticky;top:0;z-index:50;background:var(--warm);border-bottom:1px solid var(--rule);padding:9px 16px}
  .adv-controls-inner{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .adv-searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .adv-search{flex:1;min-width:220px;font-family:'DM Sans',sans-serif;font-size:15px;padding:10px 13px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
  .adv-search:focus{outline:none;border-color:var(--terra)}
  .adv-star-toggle,.adv-reset{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .adv-star-toggle.on{background:var(--ink);color:var(--ochre);border-color:var(--ink)}
  .adv-reset:hover,.adv-star-toggle:hover{border-color:var(--terra)}
  .adv-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--stone);white-space:nowrap}
  .adv-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
  /* collapsed filter pills */
  .fdrop{position:relative}
  .fdrop>summary{list-style:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;
    letter-spacing:.5px;padding:7px 12px;border:1px solid var(--rule);border-radius:20px;
    background:#fff;color:var(--ink);white-space:nowrap;user-select:none;display:flex;
    align-items:center;gap:6px;min-height:36px}
  .fdrop>summary::-webkit-details-marker{display:none}
  .fdrop>summary::after{content:'▾';font-size:9px;opacity:.5}
  .fdrop[open]>summary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .fdrop[open]>summary::after{content:'▴'}
  .fcount{background:var(--terra);color:#fff;border-radius:10px;font-size:9px;
    padding:1px 6px;min-width:16px;text-align:center}
  .fpanel{position:absolute;z-index:60;top:calc(100% + 5px);left:0;min-width:210px;max-width:82vw;
    max-height:52vh;overflow-y:auto;background:#fff;border:1px solid var(--rule);border-radius:9px;
    padding:9px;display:flex;flex-wrap:wrap;gap:5px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
  .adv-fglabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin-right:2px}
  .adv-chip{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3px;padding:4px 9px;border-radius:20px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
  .adv-chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .adv-chip.on[data-kind="kid"]{background:var(--kidcol,var(--terra));border-color:var(--kidcol,var(--terra))}

  /* table */
  .adv-tablewrap{max-width:1500px;margin:0 auto;padding:0 16px 60px;overflow-x:auto}
  table.adv{border-collapse:collapse;width:100%;min-width:1120px;font-family:'DM Sans',sans-serif;font-size:13.5px;background:var(--warm)}
  table.adv thead th{position:sticky;top:0;background:var(--ink);color:var(--cream);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:500;text-align:left;padding:11px 12px;cursor:pointer;white-space:nowrap;z-index:5}
  table.adv thead th:hover{color:var(--ochre)}
  table.adv thead th .ar{opacity:.5;font-size:9px}
  table.adv tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.adv tbody tr:hover{background:#fff}
  .c-leg{font-family:'DM Mono',monospace;font-weight:500;color:var(--terra);white-space:nowrap}
  .c-leg small{display:block;color:var(--stone);font-size:10px;letter-spacing:.3px;margin-top:2px}
  .c-city{font-weight:500;white-space:nowrap}
  .c-region{color:var(--stone);font-size:12px;white-space:nowrap}
  .c-title{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;line-height:1.2;min-width:210px}
  .adv-thumb-img{width:100%;max-width:230px;height:92px;object-fit:cover;border-radius:4px;display:block;margin-bottom:8px;background:#e9e2d6}
  .c-title .em{font-size:14px;margin-right:4px}
  .c-title .star{color:var(--ochre);font-size:12px}
  .c-desc{color:var(--ink);opacity:.85;line-height:1.4;min-width:230px;max-width:340px}
  .c-get{color:var(--ink);opacity:.8;line-height:1.35;min-width:170px;max-width:230px;font-size:12.5px}
  .c-cost{white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;color:var(--stone)}
  .c-six{white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;line-height:1.35}
  .c-six .six-eur{display:block;font-weight:600;color:var(--ink)}
  .c-six .six-usd{display:block;font-size:10.5px;color:var(--stone)}
  .c-six .six-note{display:block;font-size:9.5px;color:var(--stone);opacity:.75;white-space:normal;max-width:150px;margin-top:2px}
  .c-six .six-free{display:block;font-weight:600;color:#4f6b3f}
  .c-six .six-unk{color:var(--stone);opacity:.5}
  .c-for{white-space:nowrap}
  .kid{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.3px;color:#fff;border-radius:20px;padding:2px 7px;margin:0 3px 3px 0;text-transform:uppercase}
  .c-links a{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--terra);text-decoration:none;border:1px solid var(--rule);border-radius:4px;padding:3px 7px;margin:0 4px 4px 0;white-space:nowrap}
  .c-links a:hover{border-color:var(--terra);background:var(--terra);color:#fff}
  .reach-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--stone);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-top:5px}
  .adv-empty{padding:50px;text-align:center;color:var(--stone);font-family:'DM Mono',monospace;font-size:13px}
  .adv-sync{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3px;color:var(--stone);white-space:nowrap}
  .adv-sync.ok{color:#2C7A7B}.adv-sync.warn{color:#B7791F}
  .c-plan{white-space:nowrap;min-width:150px}
  .adv-status{font-family:'DM Mono',monospace;font-size:11px;padding:4px 6px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
  .adv-note{display:block;margin-top:5px;width:140px;font-family:'DM Sans',sans-serif;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
  .adv-note:focus,.adv-status:focus{outline:none;border-color:var(--terra)}
  table.adv tbody tr[data-status="booked"]{background:rgba(44,122,123,.08)}
  table.adv tbody tr[data-status="want"]{background:rgba(212,146,10,.08)}
  table.adv tbody tr[data-status="skip"]{opacity:.5}
  .adv-chip.on[data-kind="plan"]{background:#2C7A7B;border-color:#2C7A7B}
  /* ── per-leg splurge panel ── */
  .adv-legs{max-width:1500px;margin:18px auto 0;padding:0 16px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
  .leg-card{background:var(--warm);border:1px solid var(--line);border-radius:8px;padding:12px 13px}
  .leg-city{font-family:'Playfair Display',serif;font-weight:700;font-size:16px}
  .leg-dates{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;color:var(--stone);margin-bottom:7px}
  .leg-counts{font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
  .leg-counts strong{color:#4f6b3f;font-size:13px}
  .leg-splurge{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:12px;line-height:1.35;color:var(--ink)}
  .leg-splab{display:block;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--terra);margin-bottom:2px}
  .leg-spcost{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--stone);margin-top:2px}
  .adv-hidden{font-family:'DM Mono',monospace;font-size:10px;color:var(--stone);opacity:.75}
  .adv-hidden:empty{display:none}
  .adv-hidden strong{color:var(--terra)}

  /* ── Dan's curated keepers ── */
  .adv-keeps{max-width:1500px;margin:12px auto 0;padding:0 16px}
  .adv-keeps .kp-grid{display:none}
  .adv-keeps .kp-head{margin-bottom:0}
  .kp-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:9px}
  .kp-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ochre)}
  .kp-total{font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
  .kp-total strong{color:var(--ink);font-size:13px}
  .kp-note{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--stone);opacity:.9}
  .kp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
  .kp-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ochre);
    border-radius:7px;padding:9px 11px}
  .kp-where{display:block;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--ochre)}
  .kp-name{display:block;font-size:13px;line-height:1.3;margin:2px 0 3px}
  .kp-cost{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
  .kp-cost em{font-style:normal;color:var(--terra)}
  .keep-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;
    text-transform:uppercase;background:var(--ochre);color:#fff;border-radius:3px;padding:1px 5px;
    vertical-align:middle}

  .leg-now{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
  .leg-now-city{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--ink)}
  .leg-now-c strong{color:#4f6b3f}
  .adv-legs{max-width:1500px;margin:12px auto 0;padding:0 16px}

  /* ── YOUR PICKS bar ── */
  .adv-picks{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;
    font-family:'DM Mono',monospace;font-size:11px;color:var(--stone)}
  .adv-picks:empty{display:none}
  .adv-picks .pick-lab{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--terra)}
  .adv-picks .pick-big{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
  .adv-picks .pick-usd{font-size:11px}
  .adv-picks .pick-part{padding:2px 8px;border-radius:20px;background:var(--cream);white-space:nowrap}
  .adv-picks .pick-booked{background:rgba(44,122,123,.13);color:#22615f}
  .adv-picks .pick-want{background:rgba(212,146,10,.15);color:#8a6400}
  .adv-picks .pick-empty{font-size:11px;opacity:.85}
  .adv-picks .pick-empty strong{color:var(--ink)}
  .adv-picks .pick-clear{margin-left:auto;font-family:'DM Mono',monospace;font-size:9px;
    letter-spacing:.8px;text-transform:uppercase;padding:4px 9px;border:1px solid var(--rule);
    border-radius:4px;background:#fff;color:var(--stone);cursor:pointer}
  .adv-picks .pick-clear:hover{border-color:var(--terra);color:var(--terra)}

    .c-six .six-range{display:block;font-size:9.5px;color:var(--stone);opacity:.8}

  /* ══════════════════════════════════════════════════════════════════
   * MOBILE — below 760px the 12-column table stops being a table and
   * becomes one card per activity. Shrinking a 12-col grid to phone
   * width is unreadable at any font size, so we restack instead.
   * Labels come from data-l on each cell (set in render()).
   * ════════════════════════════════════════════════════════════════ */
  @media(max-width:1000px){
    .c-region,.c-desc{display:none}
  }
  @media(max-width:760px){
    /* The header is branding; on a phone you want the filters, not the title. */
    .adv-head{padding:12px 14px 6px}
    .adv-h1{font-size:20px;margin:6px 0 2px}
    .adv-sub{font-size:11.5px;line-height:1.35}
    .adv-back{font-size:10px}
    .adv-controls{padding:7px 12px}
    .adv-controls-inner{gap:6px}
    .adv-search{min-width:0;flex:1 1 100%;font-size:16px;padding:8px 11px}  /* 16px stops iOS zoom */
    .adv-star-toggle,.adv-reset{font-size:10px;padding:7px 9px}
    .adv-count{font-size:10px}
    .adv-sync{display:none}
    .fdrop>summary{font-size:10px;padding:6px 10px;min-height:32px;gap:4px}
    .fpanel{min-width:190px;max-width:88vw}
    .adv-keeps,.adv-legs{margin-top:7px}
    .leg-now-city{font-size:14px}
    .leg-now{font-size:10px;gap:7px}
    .adv-tablewrap{padding:0 12px 48px;overflow-x:visible}
    table.adv{min-width:0;width:100%;display:block;background:transparent}
    table.adv thead{display:none}
    table.adv tbody{display:block}
    /* Flex column so we can ORDER the card: title → price → detail → plan.
       The table's source order puts the notes box first, which is useless here. */
    table.adv tbody tr{
      display:flex;flex-direction:column;background:var(--warm);border:1px solid var(--line);
      border-radius:9px;padding:13px 14px;margin-bottom:11px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
    table.adv tbody tr:hover{background:var(--warm)}
    table.adv tbody td{display:block;border:0;padding:0 0 6px}
    table.adv tbody td:last-child{padding-bottom:0}
    table.adv tbody td.c-title{order:1}
    table.adv tbody td.c-six  {order:2}
    table.adv tbody td.c-for  {order:3}
    table.adv tbody td.c-get  {order:4}
    table.adv tbody td.c-links{order:5}
    table.adv tbody td.c-plan {order:6}
    /* Hide the noisy columns. Needs the full selector — `table.adv tbody td`
       out-specifies a bare `.c-leg`, which is why these were still showing. */
    table.adv tbody td.c-leg,
    table.adv tbody td.c-city,
    table.adv tbody td.c-region,
    table.adv tbody td.c-desc,
    table.adv tbody td.c-cost{display:none}
    /* title leads the card */
    .c-title{font-size:15.5px;font-weight:500;line-height:1.3;padding-bottom:7px!important}
    /* The thumbnail is the same generic city shot on every card in a leg — it adds
       ~130px per card and tells you nothing. Gone on phones. */
    .c-title .adv-thumb-img{display:none}
    .c-for{padding-bottom:4px!important}
    .c-get{font-size:12px;padding-bottom:5px!important}
    .c-plan .adv-note{margin-top:0}
    /* every remaining cell gets its label back */
    table.adv tbody td[data-l]::before{
      content:attr(data-l);display:block;font-family:'DM Mono',monospace;font-size:9px;
      letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin-bottom:2px}
    /* Price on one line. The range and the pricing-basis note are desk research —
       standing in a street you want the number, not the derivation. */
    .c-six{background:rgba(196,83,26,.05);border-radius:6px;padding:6px 9px!important;margin:1px 0 6px}
    .c-six .six-eur{display:inline;font-size:16px}
    .c-six .six-usd{display:inline;margin-left:6px;font-size:11px}
    .c-six .six-range,.c-six .six-note{display:none}
    .c-six .six-splurge{margin:0 6px 0 0}
    /* The data-l labels earn their keep on Getting-there; elsewhere they are noise. */
    table.adv tbody td.c-for::before,
    table.adv tbody td.c-get::before{display:none}
    .c-links a{padding:5px 9px}
    /* Notes are a planning-desk tool. In the street you only ever tap Want/Booked,
       so the note field goes and the status select becomes the whole row. */
    .c-plan{display:flex;gap:8px;padding-top:7px!important;border-top:1px solid var(--line)!important;margin-top:3px}
    .c-plan .adv-note{display:none}
    .c-plan .adv-status{flex:1;min-height:38px;font-size:16px}
    .c-links{display:flex;gap:14px}
    .adv-totals .tot-big{font-size:17px}
    .adv-picks{gap:7px;padding:8px 10px}
    .adv-picks .pick-big{font-size:18px}
    .adv-picks .pick-clear{margin-left:0}
    .adv-legs{grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
    .leg-card{padding:10px 11px}
    .leg-city{font-size:14px}
    .adv-splurge,.adv-keeps{padding:0 12px}
    .kp-grid{grid-template-columns:1fr}
    .sp-grid{grid-template-columns:1fr}
  }
  @media(max-width:420px){
    .adv-tablewrap{padding:0 9px 40px}
    table.adv tbody tr{padding:11px 12px}
    .c-title{font-size:15px}
  }
</style>
</head>
<body>

<header class="adv-head">
  <a class="adv-back" href="/">← Map</a>
  <h1 class="adv-h1">Adventures <em>&amp; activities</em></h1>
  <p class="adv-sub">Filter to the town you're in, then to what you can spend. Prices are the total for all six of us.</p>

</header>

<div class="adv-controls">
  <div class="adv-controls-inner">
    <div class="adv-searchrow">
      <input id="advSearch" class="adv-search" type="search" placeholder="Search title, place, description…" autocomplete="off">
      <button id="advStar" class="adv-star-toggle" type="button">★ Must-do only</button>
      <button id="advReal" class="adv-star-toggle on" type="button" title="Hide anything over ~$500 for six">💸 Realistic budget</button>
      <button id="advReset" class="adv-reset" type="button">Reset</button>
      <span id="advCount" class="adv-count"></span>
      <span id="advSync" class="adv-sync"></span>
    </div>
    <div id="advHidden" class="adv-hidden"></div>
    <div id="advPicks" class="adv-picks"></div>
    <div id="advFilters" class="adv-filters"></div>
  </div>
</div>

<div id="advLegs" class="adv-legs"></div>
<div id="advKeeps" class="adv-keeps"></div>

<div class="adv-tablewrap">
  <table class="adv">
    <thead><tr id="advHead"></tr></thead>
    <tbody id="advBody"></tbody>
  </table>
  <div id="advEmpty" class="adv-empty" style="display:none">No matches — try clearing a filter.</div>
</div>

<script src="/adventures-data.js" defer></script>
<script src="/party-cost.js" defer></script>
<script src="/adventure-costs.js" defer></script>
<script src="/shortlist.js" defer></script>
<script src="/menu.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  var DATA = window.TRIP_ADVENTURES || [];
  var LEGS = window.TRIP_LEGS || [];
  var legMap = {}; LEGS.forEach(function (l) { legMap[l.leg] = l; });

  var KIDS = [
    { id:'rhys', label:'Rhys', col:'#C4531A' },
    { id:'jude', label:'Jude', col:'#8C6239' },
    { id:'grey', label:'Grey', col:'#2C7A7B' },
    { id:'keir', label:'Keir', col:'#3D7EA6' },
    { id:'parents', label:'Dan & Kei', col:'#6B5B95' },
    { id:'all',  label:'All',  col:'#8C7B6B' },
  ];
  var kidCol = {}; KIDS.forEach(function (k) { kidCol[k.id] = k; });

  var CATS = {
    machines:['⚙️','Machines'], rock:['🪨','Rocks & gems'], weird:['💀','Weird museum'],
    hunt:['🗺️','Treasure hunt'], craft:['🛠️','Craft & workshop'], transport:['🚡','Transport'],
    castle:['🏰','Castle & fort'], water:['🚣','Water & boats'], detour:['🚂','On-the-way stop'],
    whoa:['😮','Big “whoa”'], underground:['🕳️','Underground'], secret:['🔑','Behind-the-scenes'],
    maze:['🌀','Maze & illusion'], thrill:['🧗','Climb & thrill'], food:['🍕','Food you make'],
    architecture:['🏛️','Weird architecture'], animals:['🦅','Animals'], caves:['🦇','Caves'],
    mountain:['⛰️','Mountains'], art:['🖼️','Art & masters'], sight:['📸','Landmark & view'],
    dining:['🍽️','Dining out'], nature:['🌿','Nature & gardens'], church:['⛪','Church & relics'],
    market:['🛍️','Market & food hall'], bike:['🚵','Trail biking']
  };
  var REACH = { base:'In town', way:'On the way', day:'Day-trip', far:'Far · own trip' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mapsUrl(it){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.n + ' ' + it.city + ' Italy'); }

  // ── stable id per activity (must match the sheet seed) + lookup ──
  function slug(it){ return it.leg + '-' + String(it.n).toLowerCase().normalize('NFKD')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
  var ID2IT = {};
  DATA.forEach(function (it){ it._id = slug(it); ID2IT[it._id] = it; });

  // ── save-back (Google Sheet via /api) + local fallback ──
  var SAVE = { secret: 'italy2026-adv-sync-7Qx', save: '/api/save', list: '/api/list' };
  var PLAN_KEY = 'advPlanV1';
  var plan = {};
  try { plan = JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch (e) { plan = {}; }
  var syncEl = document.getElementById('advSync');
  function setSync(t, cls){ if (syncEl){ syncEl.textContent = t; syncEl.className = 'adv-sync' + (cls ? ' ' + cls : ''); } }
  var STLBL = { '':'—', want:'Want', booked:'Booked', skip:'Skip' };
  var saveTimers = {};
  function pushSave(id){
    var it = ID2IT[id]; if (!it) return;
    var p = plan[id] || { status:'', notes:'' };
    localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
    clearTimeout(saveTimers[id]);
    saveTimers[id] = setTimeout(function (){
      setSync('☁ Saving…', '');
      fetch(SAVE.save, { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ secret:SAVE.secret, id:id, title:it.n, leg:it.leg, city:it.city, status:p.status, notes:p.notes }) })
        .then(function (r){ return r.json(); })
        .then(function (j){ setSync(j && j.ok ? '☁ Synced to Sheet' : '⌂ Saved on device (sheet: ' + ((j && j.reason) || 'error') + ')', j && j.ok ? 'ok' : 'warn'); })
        .catch(function (){ setSync('⌂ Saved on device (offline)', 'warn'); });
    }, 450);
  }

  // ── party-of-6 cost: researched override first, else parse the free-text `k` ──
  var EUR_USD = 1.16;              // Aug-2026 working rate; bands below are USD
  var COSTS = window.ADVENTURE_COSTS || {};
  var KEEP = {};                                   // Dan's curated keepers
  (window.TRIP_SHORTLIST || []).forEach(function (id){ KEEP[id] = true; });
  // Every priced row gets `eur`: ONE whole-euro number for the whole party, so
  // the column can be summed and averaged. Ranges collapse to their midpoint.
  function norm(c) { c.eur = Math.round((c.lo + c.hi) / 2); return c; }
  function costOf(it) {
    var o = COSTS[it._id] || COSTS[it.n];
    if (o && o.lo != null) return norm({ lo:o.lo, hi:(o.hi != null ? o.hi : o.lo), note:o.note || '', src:'researched' });
    var p = window.partyCost && window.partyCost(it.k, it.leg);
    if (p) return norm({ lo:p.lo, hi:p.hi, note:p.basis, src:'parsed' });
    return null;
  }
  function usd(e){ return e * EUR_USD; }
  // Bands are on the TOTAL for six, in USD. ($200–300 added to close the gap.)
  // Bands test the normalised `eur` midpoint, so a row lands in exactly one.
  var BANDS = [
    { id:'free', label:'Free / donation', t:function (c){ return c.eur === 0; } },
    { id:'u50',  label:'$0–50',    t:function (c){ return c.eur > 0 && usd(c.eur) < 50; } },
    { id:'50',   label:'$50–100',  t:function (c){ return usd(c.eur) >= 50 && usd(c.eur) < 100; } },
    { id:'100',  label:'$100–200', t:function (c){ return usd(c.eur) >= 100 && usd(c.eur) < 200; } },
    { id:'200',  label:'$200–300', t:function (c){ return usd(c.eur) >= 200 && usd(c.eur) < 300; } },
    { id:'300',  label:'$300+',    t:function (c){ return usd(c.eur) >= 300; } },
    { id:'unk',  label:'Unpriced', t:function (){ return false; }, unpriced:true }
  ];

  // Dan's rule (30 Aug): the trip is free / cultural / nature / low-cost, with
  // ONE splurge per leg. Anything over ~$500 for six is hidden unless you ask.
  // Dan reviewed every activity over $200 by hand on 30 Aug and kept only the
  // eight in shortlist.js. So the cap is $200 and the shortlist is the ONLY
  // exception — being a ★must-do no longer earns a pass.
  var SPLURGE_EUR = 172;                      // ≈ $200 at 1.16
  var CHEAP_EUR = 86;                         // ≈ $100 — the "easy yes" line

  // ── filter state ──
  var state = { legs:{}, kids:{}, cats:{}, reach:{}, plan:{}, price:{}, q:'', star:false,
                realistic:true, sort:{ col:'leg', dir:1 } };

  // seed from URL (?kid=jude&leg=5)
  var params = new URLSearchParams(location.search);
  if (params.get('kid') && kidCol[params.get('kid')]) state.kids[params.get('kid')] = true;
  if (params.get('leg')) state.legs[params.get('leg')] = true;

  // ── build filter chips ──
  var filtersEl = document.getElementById('advFilters');
  function bagOf(kind){ return kind === 'kid' ? state.kids : kind === 'leg' ? state.legs : kind === 'cat' ? state.cats : kind === 'plan' ? state.plan : kind === 'price' ? state.price : state.reach; }
  function chip(kind, id, label, col) {
    var on = bagOf(kind)[id];
    var extra = (kind === 'kid') ? ' data-kind="kid" style="' + (on ? '--kidcol:' + col : '') + '"' : '';
    return '<button type="button" class="adv-chip' + (on ? ' on' : '') + '"' + extra +
      ' data-kind="' + kind + '" data-id="' + esc(id) + '">' + esc(label) + '</button>';
  }
  // Each filter group is a COLLAPSED dropdown, not a wall of chips. On a phone the
  // whole control strip is six pills; open one, tick what you want, close it.
  // `openGroups` survives the re-render that every chip click triggers.
  var openGroups = {};
  function fgroup(kind, label, chipsHtml, activeCount) {
    var open = openGroups[kind] ? ' open' : '';
    return '<details class="fdrop" data-kind="' + kind + '"' + open + '>' +
      '<summary>' + esc(label) +
        (activeCount ? '<span class="fcount">' + activeCount + '</span>' : '') +
      '</summary><div class="fpanel">' + chipsHtml + '</div></details>';
  }
  function countOn(bag) { return Object.keys(bag).filter(function (k){ return bag[k]; }).length; }

  function buildFilters() {
    var usedCats = {}; DATA.forEach(function (d) { usedCats[d.c] = true; });
    var h = '';
    h += fgroup('leg', 'Where',
      LEGS.map(function (l) { return chip('leg', String(l.leg), l.city); }).join(''),
      countOn(state.legs));
    h += fgroup('price', 'Budget',
      BANDS.map(function (b) { return chip('price', b.id, b.label); }).join(''),
      countOn(state.price));
    h += fgroup('kid', 'Who',
      KIDS.map(function (k) { return chip('kid', k.id, k.label, k.col); }).join(''),
      countOn(state.kids));
    h += fgroup('reach', 'How far',
      Object.keys(REACH).map(function (r) { return chip('reach', r, REACH[r]); }).join(''),
      countOn(state.reach));
    h += fgroup('cat', 'Type',
      Object.keys(CATS).filter(function (c) { return usedCats[c]; })
        .map(function (c) { return chip('cat', c, CATS[c][0] + ' ' + CATS[c][1]); }).join(''),
      countOn(state.cats));
    h += fgroup('plan', 'Status',
      [['want','Want'],['booked','Booked'],['skip','Skip'],['none','Unplanned']]
        .map(function (p) { return chip('plan', p[0], p[1]); }).join(''),
      countOn(state.plan));
    filtersEl.innerHTML = h;
  }

  // ── header ──
  var COLS = [
    { key:'plan', label:'Your plan', nosort:true },
    { key:'leg', label:'Leg' }, { key:'city', label:'City' }, { key:'rg', label:'Region' },
    { key:'n', label:'Title' }, { key:'b', label:'Description' }, { key:'w', label:'Ideal for', nosort:true },
    { key:'g', label:'How to get there' }, { key:'six', label:'Total for 6' }, { key:'k', label:'Cost (as listed)' },
    { key:'links', label:'Links', nosort:true }
  ];
  function buildHead() {
    document.getElementById('advHead').innerHTML = COLS.map(function (c) {
      var ar = '';
      if (!c.nosort && state.sort.col === c.key) ar = ' <span class="ar">' + (state.sort.dir > 0 ? '▲' : '▼') + '</span>';
      return '<th data-col="' + c.key + '"' + (c.nosort ? ' data-nosort="1"' : '') + '>' + esc(c.label) + ar + '</th>';
    }).join('');
  }

  // ── filter + sort + render ──
  function anyOn(o){ return Object.keys(o).some(function (k) { return o[k]; }); }
  function passes(it) {
    if (anyOn(state.legs) && !state.legs[String(it.leg)]) return false;
    if (anyOn(state.kids)) {
      var hit = (it.w || []).some(function (w) { return state.kids[w]; }) || (it.w || []).indexOf('all') > -1;
      if (!hit) return false;
    }
    if (anyOn(state.cats) && !state.cats[it.c]) return false;
    if (anyOn(state.reach) && !state.reach[it.r]) return false;
    if (anyOn(state.price)) {
      var c = costOf(it);
      var hit = BANDS.some(function (b) {
        if (!state.price[b.id]) return false;
        return b.unpriced ? !c : (!!c && b.t(c));
      });
      if (!hit) return false;
    }
    if (anyOn(state.plan)) { var st = (plan[it._id] && plan[it._id].status) || 'none'; if (st === '') st = 'none'; if (!state.plan[st]) return false; }
    if (state.star && !it.s) return false;
    if (state.realistic) {
      // Hide over-cap items — EXCEPT ★must-dos, which stay as splurge candidates.
      // Dan's rule: "omit anything over $500 unless it's a true must-do."
      var rc = costOf(it);
      if (rc && rc.eur > SPLURGE_EUR && !KEEP[it._id]) return false;
    }
    if (state.q) {
      var hay = (it.n + ' ' + it.b + ' ' + it.city + ' ' + it.rg + ' ' + (it.g || '')).toLowerCase();
      var toks = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!toks.every(function (t) { return hay.indexOf(t) > -1; })) return false;
    }
    return true;
  }
  function sortRows(rows) {
    var col = state.sort.col, dir = state.sort.dir;
    return rows.slice().sort(function (a, b) {
      var va, vb;
      if (col === 'six') {                       // unpriced always sinks to the bottom
        var ca = costOf(a), cb = costOf(b);
        if (!ca && !cb) return 0;
        if (!ca) return 1;
        if (!cb) return -1;
        return (ca.eur - cb.eur) * dir;
      }
      if (col === 'leg') { va = a.leg; vb = b.leg; if (va !== vb) return (va - vb) * dir; va = a.n; vb = b.n; }
      else { va = (a[col] || '').toString().toLowerCase(); vb = (b[col] || '').toString().toLowerCase(); }
      return va < vb ? -dir : va > vb ? dir : 0;
    });
  }
  // "€150 ≈ $174" for the whole party, + how we got there
  function sixCell(it) {
    var c = costOf(it);
    if (!c) return '<span class="six-unk">—</span>';
    if (c.eur === 0) return '<span class="six-free">Free</span>';
    var out = '<span class="six-eur">€' + c.eur + '</span>' +
              '<span class="six-usd">≈ $' + Math.round(usd(c.eur)) + '</span>';
    if (c.eur > SPLURGE_EUR) out = '<span class="six-splurge">splurge</span>' + out;
    if (c.hi !== c.lo) out += '<span class="six-range">range €' + Math.round(c.lo) + '–' + Math.round(c.hi) + '</span>';
    if (c.note) out += '<span class="six-note">' + esc(c.note) + '</span>';
    return out;
  }

  // ── YOUR PICKS: running total of everything marked Want / Booked.
  // Deliberately ignores the current filter — it's your shortlist for the whole
  // trip, so it must not change just because you filtered to one city.
  function renderPicks() {
    var el = document.getElementById('advPicks');
    var want = { n:0, eur:0 }, booked = { n:0, eur:0 }, unpriced = 0;
    DATA.forEach(function (it) {
      var st = plan[it._id] && plan[it._id].status;
      if (st !== 'want' && st !== 'booked') return;
      var c = costOf(it);
      var bucket = (st === 'booked') ? booked : want;
      bucket.n++;
      if (c) bucket.eur += c.eur; else unpriced++;
    });
    var total = want.eur + booked.eur, count = want.n + booked.n;
    if (!count) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<span class="pick-lab">Picked</span>' +
      '<span class="pick-big">€' + total.toLocaleString('en-US') + '</span>' +
      '<span class="pick-usd">≈ $' + Math.round(usd(total)).toLocaleString('en-US') + '</span>' +
      '<span class="pick-part">' + count + ' thing' + (count === 1 ? '' : 's') + '</span>' +
      '<button type="button" id="pickClear" class="pick-clear">clear</button>';
  }

  // ── ONE SPLURGE PER LEG ────────────────────────────────────────────
  // Dan's budget shape: mostly free/cheap, one deliberate blowout per leg.
  // The suggested splurge is the priciest ★must-do that is STILL UNDER the ~$500
  // cap — a real treat, not a blowout. Picking the most expensive starred item
  // outright suggested a EUR1,530 perfume workshop, which is the opposite of the point.
  function splurgeFor(leg) {
    var best = null;
    DATA.forEach(function (it) {
      if (it.leg !== leg || !it.s) return;
      var c = costOf(it);
      if (!c || c.eur <= CHEAP_EUR || c.eur > SPLURGE_EUR) return;
      if (!best || c.eur > best.eur) best = { it:it, eur:c.eur };
    });
    return best;
  }
  // Shows ONLY when you've filtered to one leg — i.e. the town you're standing in.
  // With no filter it stays empty; a 7-city grid is noise when you're out walking.
  // One compact line: how much the shortlist commits you to, and whether that
  // is still inside the 2-3 splurge rule. Reference, not the main event.
  function renderKeeps() {
    var el = document.getElementById('advKeeps');
    var items = DATA.filter(function (it){ return KEEP[it._id]; });
    if (!items.length) { el.innerHTML = ''; return; }
    var total = 0, splurges = 0;
    items.forEach(function (it) {
      var c = costOf(it); var e = c ? c.eur : 0;
      total += e; if (e > SPLURGE_EUR) splurges++;
    });
    el.innerHTML = '<div class="kp-head">' +
      '<span class="kp-title">Shortlist</span>' +
      '<span class="kp-total">' + items.length + ' picked · <strong>€' + total.toLocaleString('en-US') +
      '</strong> ≈ $' + Math.round(usd(total)).toLocaleString('en-US') + '</span>' +
      '<span class="kp-note">' + splurges + ' over $200</span></div>';
  }

  function renderLegPanel() {
    var el = document.getElementById('advLegs');
    var chosen = Object.keys(state.legs).filter(function (k){ return state.legs[k]; });
    if (chosen.length !== 1) { el.innerHTML = ''; return; }
    var lg = Number(chosen[0]), meta = legMap[lg] || {};
    var free = 0, cheap = 0, mid = 0;
    DATA.forEach(function (it) {
      if (it.leg !== lg) return;
      var c = costOf(it); if (!c) return;
      if (c.eur === 0) free++;
      else if (c.eur <= CHEAP_EUR) cheap++;
      else if (c.eur <= SPLURGE_EUR) mid++;
    });
    el.innerHTML = '<div class="leg-now"><span class="leg-now-city">' + esc(meta.city || ('Leg ' + lg)) +
      '</span><span class="leg-now-dates">' + esc(meta.dates || '') + '</span>' +
      '<span class="leg-now-c"><strong>' + free + '</strong> free</span>' +
      '<span class="leg-now-c"><strong>' + cheap + '</strong> under $100</span>' +
      '<span class="leg-now-c"><strong>' + mid + '</strong> $100–200</span></div>';
  }

  function render() {
    var rows = sortRows(DATA.filter(passes));
    var body = document.getElementById('advBody');
    document.getElementById('advCount').textContent = rows.length + ' of ' + DATA.length;

    renderPicks(); renderLegPanel(); renderKeeps();
    var hidden = 0;
    if (state.realistic) DATA.forEach(function (it) {
      var c = costOf(it); if (c && c.eur > SPLURGE_EUR && !KEEP[it._id]) hidden++;
    });
    document.getElementById('advHidden').innerHTML = hidden
      ? hidden + ' over ~$200 hidden'
      : '';

    document.getElementById('advEmpty').style.display = rows.length ? 'none' : 'block';
    body.innerHTML = rows.map(function (it) {
      var lg = legMap[it.leg] || {};
      var cat = CATS[it.c] || ['✨',''];
      var kids = (it.w || []).map(function (w) {
        var k = kidCol[w] || { label:w, col:'#8C7B6B' };
        return '<span class="kid" style="background:' + k.col + '">' + esc(k.label) + '</span>';
      }).join('');
      var links = '';
      if (it.l) links += '<a href="' + esc(it.l) + '" target="_blank" rel="noopener">Site ↗</a>';
      links += '<a href="' + mapsUrl(it) + '" target="_blank" rel="noopener">Map ↗</a>';
      var p = plan[it._id] || { status:'', notes:'' };
      var sel = '<select class="adv-status" data-id="' + esc(it._id) + '">' +
        ['','want','booked','skip'].map(function (o){ return '<option value="' + o + '"' + (p.status === o ? ' selected' : '') + '>' + STLBL[o] + '</option>'; }).join('') + '</select>';
      var note = '<input class="adv-note" data-id="' + esc(it._id) + '" placeholder="notes…" value="' + esc(p.notes || '') + '">';
      return '<tr data-id="' + esc(it._id) + '" data-status="' + esc(p.status || '') + '">' +
        '<td class="c-plan">' + sel + note + '</td>' +
        '<td class="c-leg">' + it.leg + '<small>' + esc(lg.dates || '') + '</small></td>' +
        '<td class="c-city">' + esc(it.city) + '</td>' +
        '<td class="c-region">' + esc(it.rg) + '</td>' +
        '<td class="c-title">' + (it.img ? '<img class="adv-thumb-img" loading="lazy" decoding="async" alt="" src="' + esc(it.img) + '" onerror="this.style.display=\'none\'">' : '') + '<span class="em">' + cat[0] + '</span>' + esc(it.n) + (it.s ? ' <span class="star">★</span>' : '') + (KEEP[it._id] ? ' <span class="keep-badge">keep</span>' : '') + '</td>' +
        '<td class="c-desc">' + esc(it.b) + '</td>' +
        '<td class="c-for" data-l="Ideal for">' + kids + '</td>' +
        '<td class="c-get" data-l="Getting there">' + esc(it.g || '') + '<span class="reach-badge">' + esc(REACH[it.r] || '') + '</span></td>' +
        '<td class="c-six" data-l="Total for 6">' + sixCell(it) + '</td>' +
        '<td class="c-cost" data-l="As listed">' + esc(it.k || '—') + '</td>' +
        '<td class="c-links">' + links + '</td>' +
      '</tr>';
    }).join('');
  }


  // ── events ──
  filtersEl.addEventListener('toggle', function (e) {
    var d = e.target; if (!d.classList || !d.classList.contains('fdrop')) return;
    openGroups[d.getAttribute('data-kind')] = d.open;
  }, true);
  filtersEl.addEventListener('click', function (e) {
    var b = e.target.closest('.adv-chip'); if (!b) return;
    var kind = b.getAttribute('data-kind'), id = b.getAttribute('data-id');
    var bag = bagOf(kind);
    bag[id] = !bag[id];
    openGroups[kind] = true;              // keep the panel you're using open
    buildFilters(); render();
  });
  document.getElementById('advPicks').addEventListener('click', function (e) {
    if (!e.target.closest('#pickClear')) return;
    if (!confirm('Clear Want/Booked on every activity? Notes are kept.')) return;
    Object.keys(plan).forEach(function (id) {
      if (plan[id] && (plan[id].status === 'want' || plan[id].status === 'booked')) {
        plan[id].status = ''; pushSave(id);
      }
    });
    buildFilters(); render();
  });
  document.getElementById('advSearch').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.getElementById('advStar').addEventListener('click', function () {
    state.star = !state.star; this.classList.toggle('on', state.star); render();
  });
  document.getElementById('advReal').addEventListener('click', function () {
    state.realistic = !state.realistic; this.classList.toggle('on', state.realistic); render();
  });
  document.getElementById('advReset').addEventListener('click', function () {
    state = { legs:{}, kids:{}, cats:{}, reach:{}, plan:{}, price:{}, q:'', star:false,
              realistic:true, sort:{ col:'leg', dir:1 } };
    document.getElementById('advReal').classList.add('on');
    openGroups = {};
    document.getElementById('advSearch').value = '';
    document.getElementById('advStar').classList.remove('on');
    buildFilters(); buildHead(); render();
  });
  document.getElementById('advHead').addEventListener('click', function (e) {
    var th = e.target.closest('th'); if (!th || th.getAttribute('data-nosort')) return;
    var col = th.getAttribute('data-col');
    if (state.sort.col === col) state.sort.dir *= -1; else state.sort = { col:col, dir:1 };
    buildHead(); render();
  });

  // ── plan controls: status select + notes, saved to sheet (+ local) ──
  var bodyEl = document.getElementById('advBody');
  bodyEl.addEventListener('change', function (e) {
    var s = e.target.closest('.adv-status'); if (!s) return;
    var id = s.getAttribute('data-id');
    plan[id] = plan[id] || { status:'', notes:'' }; plan[id].status = s.value;
    var tr = s.closest('tr'); if (tr) tr.setAttribute('data-status', s.value);
    pushSave(id);
    renderPicks();
    if (anyOn(state.plan)) render();
  });
  bodyEl.addEventListener('input', function (e) {
    var n = e.target.closest('.adv-note'); if (!n) return;
    var id = n.getAttribute('data-id');
    plan[id] = plan[id] || { status:'', notes:'' }; plan[id].notes = n.value;
    pushSave(id);
  });

  buildFilters(); buildHead(); render();

  // ── hydrate saved plan from the Sheet (falls back to local) ──
  setSync('☁ …', '');
  fetch(SAVE.list, { headers:{ 'Accept':'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok) {
        (j.items || []).forEach(function (x) { plan[x.id] = { status:x.status || '', notes:x.notes || '' }; });
        localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
        setSync('☁ Synced to Sheet', 'ok');
        render();
      } else {
        setSync(j && j.reason === 'not_configured' ? '⌂ Saved on this device (Sheet not connected yet)' : '⌂ Saved on this device', 'warn');
      }
    })
    .catch(function () { setSync('⌂ Saved on this device', 'warn'); });
});
</script>
</body>
</html>
